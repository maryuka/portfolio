<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuka -engineer-</title>
    <meta name="description" content="Yuka -engineer-" />
    <meta name="theme-color" content="#bee1e5" />
    <script>
      // 配色の初期設定。描画前に適用して、ちらつきを防ぐ
      (function () {
        var get = function (k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var mode = get("theme-mode");
        if (mode !== "light" && mode !== "dark") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.mode = mode;
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ヒラギノ丸ゴがない環境 (Windows / Android) 用の代替フォント -->
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
